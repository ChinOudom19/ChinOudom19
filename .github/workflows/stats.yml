name: Cache GitHub Stats

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours

jobs:
  download-assets:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stats (light & dark)
      - uses: suisei-cn/actions-download-file@v1.3.0
        with:
          url: "https://github-readme-stats-gules-gamma-14.vercel.app/api?username=ChinOudom19&theme=default"
          target: stats-dist
          filename: stats.svg

      - uses: suisei-cn/actions-download-file@v1.3.0
        with:
          url: "https://github-readme-stats-gules-gamma-14.vercel.app/api?username=ChinOudom19&theme=aura"
          target: stats-dist
          filename: stats-dark.svg

      # Top languages (light & dark)
      - uses: suisei-cn/actions-download-file@v1.3.0
        with:
          url: "https://github-readme-stats-gules-gamma-14.vercel.app/api/top-langs/?username=ChinOudom19&hide=html,css,less,cmake,php,blade,scss,c%2B%2B&layout=compact&langs_count=6&hide_title=true&theme=default"
          target: stats-dist
          filename: top-lang.svg

      - uses: suisei-cn/actions-download-file@v1.3.0
        with:
          url: "https://github-readme-stats-gules-gamma-14.vercel.app/api/top-langs/?username=ChinOudom19&hide=html,css,less,cmake,php,blade,scss,c%2B%2B&layout=compact&langs_count=6&hide_title=true&theme=aura"
          target: stats-dist
          filename: top-lang-dark.svg

      # Upload once
      - uses: actions/upload-artifact@v3
        with:
          name: stats-assets
          path: stats-dist

  push:
    permissions: write-all
    runs-on: ubuntu-latest
    needs: [download-assets]
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: stats-assets
          path: stats-dist

      - name: Push Stats and Languages to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats-outputs
          build_dir: stats-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
